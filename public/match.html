<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Partido</title>
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/components.css" />
  </head>
  <body>
    <header class="header">
      <h1 id="matchTitle">Partido</h1>
      <div class="header-right">
        <div class="user-info">
          <span id="userName" class="user-name"></span>
          <span id="adminBadge" class="admin-badge" style="display:none">Admin</span>
        </div>
        <button id="logoutBtn" class="secondary">Cerrar sesión</button>
      </div>
    </header>

    <main class="matches-container">
      <section id="details">
        <div id="info">Cargando…</div>
        <div class="button-group">
          <button id="joinBtn" class="primary">Apuntarme</button>
          <button id="viewFieldBtn" class="secondary">Ver Campo</button>
        </div>
      </section>

      <section id="participantsSection">
        <h2>Participantes</h2>
        <div id="participantsList">Cargando…</div>
      </section>
    </main>
    <script src="/match.js"></script>
  </body>
</html>
