<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Recuperar contraseña</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="container">
      <h1>Recuperar contraseña</h1>
      
      <div id="requestForm">
        <p>Introduce tu email para recibir un código de verificación.</p>
        <form id="forgotForm">
          <input name="email" type="email" placeholder="Email" required />
          <button type="submit">Solicitar código</button>
        </form>
        <p class="hint">En desarrollo: el código se mostrará en la consola del servidor.</p>
      </div>

      <div id="resetForm" style="display:none">
        <p>Introduce el código de verificación y tu nueva contraseña.</p>
        <form id="resetPasswordForm">
          <input name="email" type="email" placeholder="Email" required />
          <input name="token" placeholder="Código de verificación" required />
          <input name="password" type="password" placeholder="Nueva contraseña" required />
          <button type="submit">Cambiar contraseña</button>
        </form>
      </div>

      <p><a href="/">Volver al login</a></p>
    </main>
    <script src="/forgot-password.js"></script>
  </body>
</html>
