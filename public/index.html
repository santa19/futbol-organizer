<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Fútbol App - Inicia sesión</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/components.css" />
  </head>
  <body>
    <header class="header">
      <h1>Fútbol App</h1>
      <div class="header-right">
        <div class="user-info">
          <span id="userName" class="user-name"></span>
          <span id="adminBadge" class="admin-badge" style="display:none">Admin</span>
        </div>
        <button id="logoutBtn" class="secondary">Cerrar sesión</button>
      </div>
    </header>

    <main class="login-page">
      <div class="login-card" role="main">
        <div class="brand">
          <h1>Fútbol App</h1>
        </div>

        <div id="notAuth" class="auth-panel">
          <h2>Inicia sesión</h2>
          <form id="loginForm" class="login-form">
            <input name="email" type="email" placeholder="Email" required autocomplete="email" />
            <input name="password" type="password" placeholder="Contraseña" required autocomplete="current-password" />
            <button type="submit" class="primary">Entrar</button>
          </form>
          <div class="links">
            <a href="/register.html">Regístrate</a>
            <a href="/forgot-password.html">¿Olvidaste tu contraseña?</a>
          </div>
        </div>

        <div id="logged" class="auth-panel" style="display:none;">
          <p class="success">Conectado como <span id="userName"></span></p>
          <button id="logoutBtn" class="secondary">Cerrar sesión</button>
        </div>

        <footer class="mini-footer">
          <p>&copy; 2025 Fútbol App</p>
        </footer>
      </div>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
