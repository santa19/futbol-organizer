<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Dashboard - Partidos</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="container">
      <header style="display:flex;justify-content:space-between;align-items:center">
        <h1>Partidos</h1>
        <div>
          <span id="userName"></span>
          <button id="logoutBtn">Cerrar sesión</button>
        </div>
      </header>

      <section id="createMatch">
        <h2>Crear partido</h2>
        <form id="createForm">
          <input name="date" type="date" required />
          <input name="time" type="time" />
          <input name="location" placeholder="Lugar" />
          <input name="max_players" type="number" value="10" min="1" />
          <button type="submit">Crear</button>
        </form>
      </section>

      <section id="matches">
        <label>Filtrar por fecha: <input id="filterDate" type="date" /></label>
        <button id="loadBtn">Cargar</button>
        <div id="matchesList"></div>
      </section>
    </main>
    <script src="/dashboard.js"></script>
  </body>
</html>
